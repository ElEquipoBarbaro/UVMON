name: Activar licencia de Unity (solo una vez)

# Paso 1 de 2 para que el build funcione.
# Se lanza a mano desde Actions y genera un archivo .alf.
# Ese .alf se sube a https://license.unity3d.com/manual para obtener el .ulf,
# cuyo contenido se guarda como el secret UNITY_LICENSE.
# Instrucciones completas en docs/PUBLICAR.md
on:
  workflow_dispatch:

jobs:
  activacion:
    name: Generar archivo de activacion (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Pedir archivo de activacion
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.45f2

      - name: Subir el .alf
        uses: actions/upload-artifact@v4
        with:
          name: licencia-unity-alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
